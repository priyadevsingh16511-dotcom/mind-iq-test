<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mind &amp; IQ Assessment</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14181f;--muted:#5b6472;--line:#dde1e8;--accent:#2457d6;--accentSoft:#e8eefc;--err:#b3261e;--errBg:#fdecea;--noteBg:#eef3ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c24;--text:#eef1f6;--muted:#9aa4b5;--line:#2b313c;--accent:#7aa2ff;--accentSoft:#1f2a45;--err:#ff8a80;--errBg:#3a1b19;--noteBg:#1b2438}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans Devanagari","Nirmala UI",Mangal,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:16px}
.top h1{margin:8px 0 0;font-size:26px;line-height:1.2}
.sub{margin:4px 0 0;color:var(--muted)}
h2{margin:0 0 8px;font-size:19px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card.center{text-align:center;padding:40px 20px}
.notice{background:var(--noteBg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.notice strong{color:var(--text)}
.muted{color:var(--muted)}.small{font-size:13px}.big{font-size:18px;font-weight:600;margin:0}
p{margin:0}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.field input,.field select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;cursor:pointer}
.seg.sel{background:var(--accentSoft);border-color:var(--accent);color:var(--text)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--text)}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:12px 18px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0b1020}}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px}
.err{color:var(--err);font-size:14px}
.error{background:var(--errBg);color:var(--err);border-radius:10px;padding:12px 14px;font-size:14px}
.progress{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar.thin{height:6px}
.bar span{display:block;height:100%;background:var(--accent)}
.plabel{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.tline{display:flex;justify-content:space-between;align-items:baseline}
.prompt{white-space:pre-line;font-size:17px}
.prompt.strong{font-size:19px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{font:inherit;text-align:left;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:12px;padding:12px 14px;cursor:pointer;width:100%}
.opt.sel,.cell.sel{background:var(--accentSoft);border-color:var(--accent)}
.grid{display:grid;gap:6px;margin:0 auto;width:100%}
.cell{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;text-align:center;padding:2px}
button.cell{cursor:pointer}
.cell.q{background:var(--line);border-color:var(--muted)}
.digits{min-height:110px;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:42px;letter-spacing:.3em;border:1px solid var(--line);border-radius:12px;padding-left:.3em}
.digits.entry{font-size:34px}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:300px;width:100%;margin:0 auto}
.key{font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;min-height:50px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);cursor:pointer}
pre{white-space:pre-wrap;font-size:13px;margin:0}
@media (max-width:480px){.digits{font-size:34px}.top h1{font-size:22px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   SETTINGS - edit these three lines
   ===================================================================== */
const APP_NAME = 'Mind & IQ Assessment';          // change this to rename the app everywhere
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbx5D8w-Tn8vwhduQwQElFb66NmnKl6EZ0t0SBMyrDKECu6CP0_Pwnk-cGqCdMaHSfY/exec'; // paste your Google Apps Script web app URL here
const DEBUG_PREVIEW = false;                       // keep false. true shows the report to the client (testing only)
/* ===================================================================== */
const TEST_VERSION = 'MIQ 3.1 (60-question adaptive screening, English/Hinglish)';

/* ===== Helpers ===== */
function ri(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function sample(arr, n) { return shuffle(arr).slice(0, n); }
let uidc = 0;
function uid() { uidc += 1; return 'q' + uidc; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function erf(x0) {
  const s = x0 < 0 ? -1 : 1;
  const x = Math.abs(x0);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t) * Math.exp(-x * x);
  return s * y;
}
function cdf(z) { return 0.5 * (1 + erf(z / Math.SQRT2)); }
function ord(n) {
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function pc(v) { return Math.round(v * 100); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ===== Constants ===== */
const BANDS = [
  { label: '15–17', lvl: 1, mu: 0.58, sd: 0.16 },
  { label: '18–24', lvl: 2, mu: 0.6, sd: 0.16 },
  { label: '25–34', lvl: 3, mu: 0.6, sd: 0.16 },
  { label: '35–44', lvl: 3, mu: 0.58, sd: 0.16 },
  { label: '45–55', lvl: 3, mu: 0.56, sd: 0.16 }
];
function bandForAge(age) {
  if (age <= 17) return BANDS[0];
  if (age <= 24) return BANDS[1];
  if (age <= 34) return BANDS[2];
  if (age <= 44) return BANDS[3];
  return BANDS[4];
}
const SPEED_SECS = 35;
const SPEED_N = 12;
const STARTER_N = 5;
const LEVEL_NAMES = ['', 'easier', 'medium', 'harder'];
const AREA_SECS = { num: 30, verb: 20, logic: 35, pat: 35, attn: 15, power: 60, per: 25, und: 15, man: 30 };

/* ===== Item builders ===== */
function makeMC(correct, wrongs) {
  const u = [];
  for (const w of wrongs) { if (w !== correct && u.indexOf(w) < 0) u.push(w); }
  const opts = shuffle([correct].concat(u.slice(0, 3)));
  return { options: opts, answer: opts.indexOf(correct) };
}
function mcItem(area, prompt, correct, wrongs, grid) {
  const m = makeMC(correct, wrongs);
  return { id: uid(), area: area, prompt: prompt, options: m.options, answer: m.answer, grid: grid };
}
function numItem(area, prompt, ans, hints, grid) {
  const ok = function (v) { return Number.isFinite(v) && v !== ans && (ans < 0 || v >= 0); };
  const hs = shuffle(hints.map(function (h) { return Math.round(h); })).filter(ok).slice(0, 2);
  const ds = shuffle([1, 2, 3, 4, 5, 6, 8, 10, -1, -2, -3, -4, -5, -6, -8, -10]).map(function (d) { return ans + d; }).filter(ok);
  return mcItem(area, prompt, String(ans), hs.concat(ds).map(String), grid);
}

/* number series */
function genSeries(level) {
  const kinds = level <= 1 ? ['arith', 'geom', 'grow']
    : level === 2 ? ['arith2', 'geom', 'grow', 'fib', 'affine', 'alt', 'sq']
    : ['fib', 'affine', 'alt', 'sq', 'inter', 'dd', 'cube', 'grow'];
  const kind = pick(kinds);
  const seq = [];
  if (kind === 'arith') {
    const s = ri(1, 40), d = ri(2, 9);
    for (let i = 0; i < 6; i++) seq.push(s + i * d);
  } else if (kind === 'arith2') {
    const s = ri(3, 40), d = ri(4, 13);
    for (let i = 0; i < 6; i++) seq.push(s + i * d);
  } else if (kind === 'geom') {
    const r = pick(level >= 2 ? [2, 3, 4] : [2, 3]);
    const s = ri(1, 4);
    const total = r === 2 ? 6 : 5;
    for (let i = 0; i < total; i++) seq.push(s * Math.pow(r, i));
  } else if (kind === 'grow') {
    const s = ri(1, 9), d0 = ri(1, 3), dd = ri(1, 3);
    seq.push(s);
    for (let i = 1; i < 6; i++) seq.push(seq[i - 1] + d0 + (i - 1) * dd);
  } else if (kind === 'fib') {
    seq.push(ri(1, 5)); seq.push(ri(1, 7));
    for (let i = 2; i < 7; i++) seq.push(seq[i - 1] + seq[i - 2]);
  } else if (kind === 'affine') {
    const s = ri(2, 5), m = pick([2, 3]), c = pick([-1, 1, 2, 3]);
    const total = m === 3 ? 5 : 6;
    seq.push(s);
    for (let i = 1; i < total; i++) seq.push(seq[i - 1] * m + c);
  } else if (kind === 'alt') {
    const a = ri(4, 9), b = ri(1, a - 2);
    seq.push(ri(5, 30));
    for (let i = 1; i < 7; i++) seq.push(seq[i - 1] + (i % 2 === 1 ? a : -b));
  } else if (kind === 'sq') {
    const k = ri(1, 5), c = pick([-1, 0, 1, 2, 3, 5]);
    for (let i = 0; i < 6; i++) seq.push((i + k) * (i + k) + c);
  } else if (kind === 'inter') {
    const s1 = ri(2, 12), d1 = ri(2, 5);
    const useGeo = Math.random() < 0.5;
    const s2 = useGeo ? ri(1, 3) : ri(30, 50);
    const d2 = ri(2, 5);
    for (let i = 0; i < 8; i++) {
      if (i % 2 === 0) seq.push(s1 + (i / 2) * d1);
      else { const j = (i - 1) / 2; seq.push(useGeo ? s2 * Math.pow(2, j) : s2 - j * d2); }
    }
  } else if (kind === 'dd') {
    const d = ri(1, 3);
    seq.push(ri(1, 6));
    for (let i = 1; i < 6; i++) seq.push(seq[i - 1] + d * Math.pow(2, i - 1));
  } else {
    const k = ri(1, 2);
    for (let i = 0; i < 5; i++) seq.push(Math.pow(i + k, 3));
  }
  const ans = seq[seq.length - 1];
  const shown = seq.slice(0, seq.length - 1);
  const last = shown[shown.length - 1], prev = shown[shown.length - 2];
  return { shown: shown, ans: ans, hint: last + (last - prev) };
}
function seriesItem(area, level) {
  const g = genSeries(level);
  return numItem(area, g.shown.join(',  ') + ',  ?\n' + t('seriesQ'), g.ans, [g.hint, g.ans + 1, g.ans - 1]);
}

/* letter series */
const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function genLetters(level) {
  const kinds = level <= 1 ? ['step', 'back'] : level === 2 ? ['step', 'alt', 'back'] : ['alt', 'inter', 'grow'];
  for (let attempt = 0; attempt < 200; attempt++) {
    const kind = pick(kinds);
    const idx = [];
    if (kind === 'step') {
      const d = ri(2, 4), s = ri(0, 25 - 5 * d);
      for (let i = 0; i < 6; i++) idx.push(s + i * d);
    } else if (kind === 'back') {
      const d = ri(2, 4), s = ri(5 * d, 25);
      for (let i = 0; i < 6; i++) idx.push(s - i * d);
    } else if (kind === 'alt') {
      const a = ri(1, 4), b = ri(2, 5);
      idx.push(ri(0, 8));
      for (let i = 1; i < 7; i++) idx.push(idx[i - 1] + (i % 2 === 1 ? a : b));
    } else if (kind === 'inter') {
      const s1 = ri(0, 8), s2 = ri(16, 25), d1 = ri(1, 2), d2 = ri(1, 2);
      for (let i = 0; i < 8; i++) {
        if (i % 2 === 0) idx.push(s1 + (i / 2) * d1);
        else idx.push(s2 - ((i - 1) / 2) * d2);
      }
    } else {
      idx.push(ri(0, 10));
      for (let i = 1; i < 6; i++) idx.push(idx[i - 1] + i);
    }
    if (idx.every(function (v) { return v >= 0 && v <= 25; })) {
      const letters = idx.map(function (v) { return ALPHA[v]; });
      return { shown: letters.slice(0, letters.length - 1), ans: letters[letters.length - 1] };
    }
  }
  return { shown: ['A', 'C', 'E', 'G', 'I'], ans: 'K' };
}
function letterItem(level) {
  const g = genLetters(level);
  const ai = ALPHA.indexOf(g.ans);
  const wrongs = [];
  for (const d of shuffle([1, -1, 2, -2, 3, -3])) {
    const v = ai + d;
    if (v >= 0 && v <= 25) wrongs.push(ALPHA[v]);
  }
  return mcItem('pat', g.shown.join(',  ') + ',  ?\n' + t('letterQ'), g.ans, wrongs);
}

/* matrices */
const SYM6 = ['●', '■', '▲', '◆', '★', '✚'];
const DIRS = ['↑', '→', '↓', '←'];
function matrixItem(area, level) {
  const kinds = level <= 1 ? ['latin', 'count']
    : level === 2 ? ['latin', 'count', 'sum', 'arrows', 'diff']
    : ['count', 'product', 'grid', 'mult', 'arrows', 'sum'];
  const kind = pick(kinds);
  const prompt = t('matrixQ');
  if (kind === 'latin') {
    const syms = sample(SYM6, 3);
    const rowsBase = shuffle([[0, 1, 2], [1, 2, 0], [2, 0, 1]]);
    const cells = [];
    for (const row of rowsBase) for (const c of row) cells.push(syms[c]);
    const ans = cells[8];
    cells[8] = '?';
    const extra = SYM6.filter(function (s) { return syms.indexOf(s) < 0; });
    return mcItem(area, prompt, ans, syms.filter(function (s) { return s !== ans; }).concat([pick(extra)]), { cols: 3, cells: cells, font: 28 });
  }
  if (kind === 'count') {
    const g = pick(['●', '■', '▲', '◆', '★']);
    let base = 1, a = 1, b = 1;
    for (let t = 0; t < 100; t++) {
      base = ri(1, 2); a = ri(0, 2); b = ri(1, 2);
      if (a + b >= 2 && base + 2 * a + 2 * b <= 9) break;
      base = 1; a = 1; b = 1;
    }
    const cells = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) cells.push(g.repeat(base + r * a + c * b));
    const n = base + 2 * a + 2 * b;
    cells[8] = '?';
    const wrongs = [];
    for (const d of shuffle([1, -1, 2, -2, 3, -3])) {
      const v = n + d;
      if (v >= 1 && v <= 12) wrongs.push(g.repeat(v));
    }
    return mcItem(area, prompt, g.repeat(n), wrongs, { cols: 3, cells: cells, font: 14, minH: 56 });
  }
  if (kind === 'sum' || kind === 'diff' || kind === 'product') {
    const cells = [];
    let last = 0, hint = 0;
    for (let r = 0; r < 3; r++) {
      let x, y, z;
      if (kind === 'sum') { x = ri(2, 15); y = ri(2, 15); z = x + y; }
      else if (kind === 'diff') { x = ri(15, 60); y = ri(3, x - 3); z = x - y; }
      else { x = ri(2, 9); y = ri(2, 9); z = x * y; }
      cells.push(String(x), String(y), r === 2 ? '?' : String(z));
      if (r === 2) { last = z; hint = kind === 'sum' ? x * y : x + y; }
    }
    return numItem(area, prompt, last, [hint], { cols: 3, cells: cells, font: 22 });
  }
  if (kind === 'grid') {
    const base = ri(1, 9), a = ri(2, 7), b = ri(1, 6);
    const cells = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) cells.push(String(base + r * a + c * b));
    const ans = base + 2 * a + 2 * b;
    cells[8] = '?';
    return numItem(area, prompt, ans, [ans + a, ans - b], { cols: 3, cells: cells, font: 22 });
  }
  if (kind === 'mult') {
    const k = ri(1, 3);
    const cells = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) cells.push(String((r + 1) * (c + 1) * k));
    cells[8] = '?';
    return numItem(area, prompt, 9 * k, [8 * k, 6 * k], { cols: 3, cells: cells, font: 22 });
  }
  const s0 = ri(0, 3), s1 = pick([1, 3]), s2 = ri(1, 3);
  const cells = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) cells.push(DIRS[(s0 + r * s2 + c * s1) % 4]);
  const ans = cells[8];
  cells[8] = '?';
  return mcItem(area, prompt, ans, DIRS.filter(function (d) { return d !== ans; }), { cols: 3, cells: cells, font: 30 });
}

/* verbal banks: [stem, correct, w1, w2, w3, level] */
const ANALOGIES = [
  ["Bird is to nest as bee is to …","hive","honey","wing","flower",1],
  ["Hot is to cold as day is to …","night","sun","light","morning",1],
  ["Finger is to hand as toe is to …","foot","shoe","leg","nail",1],
  ["Book is to read as food is to …","eat","kitchen","plate","buy",1],
  ["Doctor is to hospital as teacher is to …","school","lesson","student","library",1],
  ["Puppy is to dog as kitten is to …","cat","milk","fur","mouse",1],
  ["Pen is to write as knife is to …","cut","sharp","fork","kitchen",1],
  ["Eye is to see as ear is to …","hear","sound","head","music",1],
  ["Ring is to finger as bracelet is to …","wrist","neck","ear","gold",2],
  ["Author is to novel as composer is to …","symphony","orchestra","instrument","concert",2],
  ["Thermometer is to temperature as ruler is to …","length","wood","straight","desk",2],
  ["Brave is to cowardly as generous is to …","selfish","kind","rich","careful",2],
  ["Painter is to canvas as sculptor is to …","marble","gallery","brush","paint",2],
  ["Fish is to school as wolf is to …","pack","forest","howl","pup",2],
  ["Drought is to water as famine is to …","food","hunger","farm","rain",2],
  ["Seed is to tree as egg is to …","chick","nest","shell","hen",2],
  ["Prologue is to epilogue as overture is to …","finale","opera","interval","melody",3],
  ["Candid is to frank as cautious is to …","wary","bold","reckless","hasty",3],
  ["Lock is to key as problem is to …","solution","puzzle","question","door",3],
  ["Frugal is to miserly as confident is to …","arrogant","shy","capable","humble",3],
  ["Cacophony is to harmony as chaos is to …","order","noise","music","disorder",3],
  ["Ephemeral is to permanent as scarce is to …","abundant","rare","precious","small",3],
  ["Marathon is to sprint as epic is to …","haiku","novel","ballad","drama",3],
  ["Pilot is to aircraft as captain is to …","ship","crew","sea","harbour",3],
  ["Telescope is to distant as microscope is to …","tiny","lens","bright","scientist",3],
  ["Sun is to day as moon is to …","night","summer","water","heat",1],
  ["Hand is to glove as foot is to …","sock","knee","toe","walk",1],
  ["Cow is to milk as hen is to …","egg","feather","farm","grain",1],
  ["Roti is to eat as water is to …","drink","wet","river","glass",1],
  ["Car is to road as train is to …","track","engine","station","ticket",1],
  ["Tiger is to cub as horse is to …","foal","mare","stable","saddle",1],
  ["Teacher is to student as doctor is to …","patient","nurse","medicine","clinic",1],
  ["Winter is to cold as summer is to …","hot","rain","wool","ice",1],
  ["Fan is to air as lamp is to …","light","bulb","switch","wire",1],
  ["Left is to right as up is to …","down","high","top","sky",1],
  ["Cotton is to cloth as wood is to …","furniture","tree","forest","axe",1],
  ["Clock is to time as scale is to …","weight","shop","heavy","metal",1],
  ["Light is to dark as noisy is to …","quiet","loud","sound","busy",1],
  ["Flower is to petal as tree is to …","leaf","forest","garden","shade",1],
  ["Gram is to weight as metre is to …","length","tape","cloth","speed",2],
  ["Astronomer is to telescope as biologist is to …","microscope","laboratory","cell","doctor",2],
  ["Shiver is to cold as sweat is to …","heat","water","summer","skin",2],
  ["Cricket is to bat as hockey is to …","stick","ball","goal","field",2],
  ["Tributary is to river as branch is to …","tree","leaf","root","forest",2],
  ["Whisper is to shout as walk is to …","run","step","road","shoe",2],
  ["Kilometre is to distance as litre is to …","volume","liquid","water","bottle",2],
  ["Judge is to court as surgeon is to …","operating theatre","scalpel","medicine","nurse",2],
  ["Sapling is to tree as cub is to …","lion","forest","claw","roar",2],

const NONSENSE = ['zorbs', 'plinks', 'quads', 'mivs', 'teks', 'borns', 'fendles', 'gribs', 'slarps', 'dorbs', 'wuffs', 'nerks'];
function syllogismItem(level) {
  const t = sample(NONSENSE, 3);
  const X = t[0], Y = t[1], Z = t[2];
  const kinds = level <= 1 ? [1, 2, 3] : level === 2 ? [1, 2, 3, 4, 5] : [2, 3, 4, 5];
  const k = pick(kinds);
  if (LANG === 'hi') return syllogismHi(k, X, Y, Z);
  const q = '\nWhich conclusion must follow?';
  if (k === 1) return mcItem('logic', 'All ' + X + ' are ' + Y + '.\nAll ' + Y + ' are ' + Z + '.' + q, 'All ' + X + ' are ' + Z, ['All ' + Z + ' are ' + X, 'No ' + X + ' are ' + Z, 'Some ' + Y + ' are not ' + Z]);
  if (k === 2) return mcItem('logic', 'No ' + Y + ' are ' + Z + '.\nAll ' + X + ' are ' + Y + '.' + q, 'No ' + X + ' are ' + Z, ['All ' + X + ' are ' + Z, 'Some ' + X + ' are ' + Z, 'All ' + Z + ' are ' + X]);
  if (k === 3) return mcItem('logic', 'All ' + Y + ' are ' + Z + '.\nSome ' + X + ' are ' + Y + '.' + q, 'Some ' + X + ' are ' + Z, ['All ' + X + ' are ' + Z, 'No ' + X + ' are ' + Z, 'All ' + Z + ' are ' + X]);
  if (k === 4) return mcItem('logic', 'No ' + Y + ' are ' + Z + '.\nSome ' + X + ' are ' + Y + '.' + q, 'Some ' + X + ' are not ' + Z, ['All ' + X + ' are ' + Z, 'No ' + X + ' are ' + Y, 'Some ' + X + ' are ' + Z]);
  return mcItem('logic', 'All ' + X + ' are ' + Y + '.\nAll ' + Z + ' are ' + Y + '.' + q, 'No definite link between ' + X + ' and ' + Z + ' can be concluded', ['All ' + X + ' are ' + Z, 'Some ' + X + ' are ' + Z, 'No ' + X + ' are ' + Z]);
}

function syllogismHi(k, X, Y, Z) {

  const q = '\nइससे कौन सी बात ज़रूर सच होगी?';

  const no = function (a, b) { return 'कोई भी ' + a + ', ' + b + ' नहीं है'; };
  const some = function (a, b) { return 'कुछ ' + a + ', ' + b + ' हैं'; };
  const someNot = function (a, b) { return 'कुछ ' + a + ', ' + b + ' नहीं हैं'; };
  if (k === 1) return mcItem('logic', all(X, Y) + '।\n' + all(Y, Z) + '।' + q, all(X, Z), [all(Z, X), no(X, Z), someNot(Y, Z)]);
  if (k === 2) return mcItem('logic', no(Y, Z) + '।\n' + all(X, Y) + '।' + q, no(X, Z), [all(X, Z), some(X, Z), all(Z, X)]);

/* Questions that count toward the 60: 5 starter + 55 main-run questions.
   The digit span and the timed speed block are two extra timed tasks and are NOT part of the 60. */
const TEST_Q = 60;

let usedKeys = {};

function kL(l) { return 'L|' + l.p; }
function kE(q) { return 'E|' + (q.s || q[0]); }
function take(arr, n, keyFn) {
  const fresh = arr.filter(function (x) { return !usedKeys[keyFn(x)]; });
  const got = sample(fresh.length >= n ? fresh : arr, n);
  got.forEach(function (x) { usedKeys[keyFn(x)] = 1; });
  return got;
}
function lvlPool(arr, L, get) {
  const p = arr.filter(function (x) { return Math.abs(get(x) - L) <= 1; });
  return p.length >= 8 ? p : arr;
}
function gen(fn) {
  for (let i = 0; i < 40; i++) {
    const it = fn();
    const k = 'G|' + it.prompt + '|' + (it.grid ? it.grid.cells.join('') : '');
    if (!usedKeys[k]) { usedKeys[k] = 1; return it; }
  }
  return fn();
}
function analogyItem(a) { return mcItem('verb', a[0] + '\n' + t('anaQ'), a[1], [a[2], a[3], a[4]]); }
function oddItem(o) {

}

}

  for (const o of take(lvlPool(ODDS, L, function (x) { return x.lvl; }), 2, kO)) items.push(oddItem(o));

  items.push(gen(function () { return orderingItem('logic', L <= 1 ? 3 : 4); }));
  for (const l of take(lvlPool(LOGICS, L, function (x) { return x.lvl; }), 3, kL)) items.push(logicFrom(l, 'logic'));
  for (let i = 0; i < 2; i++) items.push(gen(function () { return letterItem(L); }));
  for (let i = 0; i < 2; i++) items.push(gen(function () { return matrixItem('pat', L); }));

}

  const pl = Math.min(3, L + 1);

  items.push(gen(function () { return seriesItem('power', 3); }));
  items.push(gen(function () { return matrixItem('power', pl); }));
  items.push(gen(function () { return orderingItem('power', 5); }));
  items.push(gen(wordProblem));
  items.push(gen(wordProblem));

  hard.forEach(function (l) { items.push(logicFrom(l, 'power')); });

  const slots = [];
  for (let k = 0; k < blocks.length; k++) slots.push(Math.max(1, Math.floor((k + Math.random()) * (total / blocks.length))));
  const out = [];
  let ii = 0, bi = 0;
  for (let i = 0; i < total; i++) {

    else if (ii < items.length) { out.push(items[ii]); ii += 1; }
    else if (bi < blocks.length) { out.push(blocks[bi]); bi += 1; }
  }
  return out;
}

function bioAdjust(bio, ageN) {

function iqCategory(iq) {
  if (iq >= 130) return 'Very high';
  if (iq >= 120) return 'High';
  if (iq >= 110) return 'Above average';
  if (iq >= 90) return 'Average';

function computeResult(steps, answers, sc, band, adj, level) {

      cnt[a] = (cnt[a] || 0) + 1;
      if (sel === undefined || sel < 0) skipped += 1; else answered += 1;
    } else if (s.kind === 'likert') {
      const sel = answers[s.item.id];
      if (sel === undefined || sel < 0) { skipped += 1; }

function render() {
  clearTimers();
  if (S.phase === 'lang') renderLang();
  else if (S.phase === 'start') renderStart();
  else if (S.phase === 'run') renderRun();
  else if (S.phase === 'review') renderReview();
  else renderDone();
  if (typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
}

/* ---- language choice ---- */
function renderLang() {
  root.innerHTML = '<header class="top"><h1>' + esc(APP_NAME) + '</h1></header>' +
    '<section class="card center" style="padding:28px 20px"><h2>' + esc(UI_TEXT.hi.langTitle) + '</h2><p class="muted">' + esc(UI_TEXT.en.langTitle) + '</p>' +
    '<div class="opts" style="max-width:360px;width:100%;margin:8px auto 0">' +
    LANG_OPTIONS.map(function (o) {
      return '<button type="button" class="opt" data-lang="' + o.code + '" lang="' + o.htmlLang + '" style="text-align:center;padding:16px"><span style="display:block;font-size:22px;font-weight:600">' + esc(o.label) + '</span><span class="muted small">' + esc(o.sub) + '</span></button>';
    }).join('') + '</div></section>';
  $$('[data-lang]').forEach(function (el) {
    el.addEventListener('click', function () {
      setLanguage(el.getAttribute('data-lang'));
      EST = estimate();
      S.phase = 'start';
      render();
    });
  });
}

/* ---- start / biodata ---- */
function optionsHtml(list, val) {
  return list.map(function (o) { return '<option value="' + esc(o) + '"' + (o === val ? ' selected' : '') + '>' + esc(bioLabel(o)) + '</option>'; }).join('');
}
function selectField(key, label, list) {
  return '<label class="field"><span>' + esc(label) + '</span><select data-bio="' + key + '"><option value="">' + esc(t('select')) + '</option>' + optionsHtml(list, S.bio[key]) + '</select></label>';
}
function renderStart() {
  const b = S.bio;
  const eng = ENG_LABELS.map(function (l, i) {
    return '<button type="button" class="seg' + (String(i + 1) === b.eng ? ' sel' : '') + '" data-eng="' + (i + 1) + '">' + esc(bioLabel(l)) + '</button>';
  }).join('');
  const tv = { q: EST.q, t: EST.timed, m: EST.minutes, m4: EST.minutes + 4, m5: EST.minutes + 5 };
  root.innerHTML = headerHtml() +
    '<div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="langBtn" style="padding:6px 12px;font-size:14px">' + esc(t('changeLang')) + ' (' + (LANG === 'hi' ? 'हिंदी' : 'English') + ')</button></div>' +
    '<div class="notice"><strong>' + esc(t('screeningOnly')) + '</strong> ' + esc(t('notice')) + '</div>' +
    '<section class="card"><h2>' + esc(t('lenTitle')) + '</h2>' +
    '<p class="big">' + esc(t('lenBig', tv)) + '</p>' +
    '<p class="muted">' + esc(t('lenText', tv)) + '</p></section>' +
    '<section class="card"><h2>' + esc(t('aboutTitle')) + '</h2>' +
    '<p class="muted">' + esc(t('aboutText')) + '</p>' +
    '<label class="field"><span>' + esc(t('name')) + '</span><input type="text" data-bio="name" autocomplete="name" placeholder="' + esc(t('namePh')) + '" value="' + esc(b.name) + '"></label>' +
    '<label class="field"><span>' + esc(t('age')) + '</span><input type="number" inputmode="numeric" min="15" max="55" data-bio="age" placeholder="' + esc(t('agePh')) + '" value="' + esc(b.age) + '"></label>' +
    '<p class="err" id="ageErr" style="display:none">' + esc(t('ageErr')) + '</p>' +
    selectField('gender', t('gender'), GENDERS) +
    selectField('edu', t('edu'), EDUS) +
    selectField('occ', t('occ'), OCCS) +
    selectField('state', t('state'), STATES) +
    selectField('lang', t('lang'), LANGS) +
    '<div class="field"><span>' + esc(t('readQ')) + '</span><div class="segs">' + eng + '</div></div>' +
    selectField('sleep', t('sleep'), SLEEPS) +
    selectField('prior', t('prior'), PRIORS) +
    '<label class="check"><input type="checkbox" id="consent"' + (S.consent ? ' checked' : '') + '><span>' + esc(t('consent')) + '</span></label>' +
    '<button type="button" class="btn primary" id="startBtn" disabled>' + esc(t('startBtn')) + '</button>' +
    '<p class="muted small" id="startHint"></p></section>' +
    '<section class="card"><h2>' + esc(t('expectTitle')) + '</h2><p class="muted">' + esc(t('expectText')) + '</p></section>';
  $('#langBtn').addEventListener('click', function () { S.phase = 'lang'; render(); });
  $$('[data-bio]').forEach(function (el) {
    const ev = el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(ev, function () { S.bio[el.getAttribute('data-bio')] = el.value; refreshStart(); });
  });
  $$('[data-eng]').forEach(function (el) {
    el.addEventListener('click', function () {
      S.bio.eng = el.getAttribute('data-eng');
      $$('[data-eng]').forEach(function (x) { x.classList.toggle('sel', x === el); });
    });
  });
  $('#consent').addEventListener('change', function (e) { S.consent = e.target.checked; refreshStart(); });
  $('#startBtn').addEventListener('click', startTest);
  refreshStart();
}
function startValid() {
  const a = parseInt(S.bio.age, 10);
  const ageOk = Number.isFinite(a) && a >= 15 && a <= 55;
  return { ageOk: ageOk, ok: ageOk && S.bio.name.trim() !== '' && S.bio.edu !== '' && S.consent };
}
function refreshStart() {
  const v = startValid();
  $('#startBtn').disabled = !v.ok;
  $('#ageErr').style.display = (S.bio.age !== '' && !v.ageOk) ? 'block' : 'none';
  let hint = '';
  if (!v.ok) {
    const miss = [];
    if (S.bio.name.trim() === '') miss.push(t('needName'));
    if (!v.ageOk) miss.push(t('needAge'));
    if (S.bio.edu === '') miss.push(t('needEdu'));
    if (!S.consent) miss.push(t('needConsent'));
    hint = t('stillNeeded', { list: miss.join(', ') });
  }
  $('#startHint').textContent = hint;
}
function startTest() {
  if (!startValid().ok) return;
  S.steps = buildStarter();
  S.level = 0; S.idx = 0; S.answers = {}; S.scores = {};
  S.payload = null; S.text = ''; S.submitting = false; S.submitted = false; S.error = '';
  S.phase = 'run';
  render();
}

/* ---- run ---- */
function renderRun() {
  const step = S.steps[S.idx];
  const total = S.level === 0 ? EST.total : S.steps.length;
  const pct = Math.min(100, (S.idx / total) * 100);
  root.innerHTML = headerHtml() +
    '<div class="progress"><div class="bar"><span style="width:' + pct + '%"></span></div>' +
    '<div class="plabel"><span>' + esc(t('qOf', { i: S.idx + 1, n: total })) + '</span><span>' + esc(t('complete', { p: Math.round(pct) })) + '</span></div>' +
    ((step.kind === 'span' || step.kind === 'speed') ? '<div class="muted small">' + esc(t('shortTask')) + '</div>' : '') + '</div>' +
    '<section class="card" id="panel"></section>';
  const panel = $('#panel');
  if (step.kind === 'mc') mountMC(step, panel);
  else if (step.kind === 'likert') mountLikert(step, panel);
  else if (step.kind === 'span') mountSpan(step, panel);
  else mountSpeed(step, panel);
}
function gridHtml(g, pickMode) {
  return '<div class="grid" style="grid-template-columns:repeat(' + g.cols + ',minmax(0,1fr));max-width:' + (g.maxW || 300) + 'px">' +
    g.cells.map(function (c, i) {
      const st = 'min-height:' + (g.minH || 56) + 'px;font-size:' + (g.font || 22) + 'px';
      const q = c === '?' ? ' q' : '';
      return pickMode ? '<button type="button" class="cell' + q + '" data-i="' + i + '" style="' + st + '">' + esc(c) + '</button>'
        : '<div class="cell' + q + '" style="' + st + '">' + esc(c) + '</div>';
    }).join('') + '</div>';
}
function bindChoice(panel, sel, onPick) {
  $$(sel, panel).forEach(function (el) {
    el.addEventListener('click', function () {
      $$(sel, panel).forEach(function (x) { x.classList.toggle('sel', x === el); });
      onPick(parseInt(el.getAttribute('data-i'), 10));
    });
  });
}
function answerAndNext(id, sel) {
  S.answers[id] = sel;
  next();
}
function mountMC(step, panel) {
  const it = step.item;
  let sel = null, done = false;
  panel.innerHTML = '<div class="prompt">' + esc(it.prompt) + '</div>' +
    (it.grid ? gridHtml(it.grid, !!it.pick) : '') +
    (!it.pick ? '<div class="opts">' + it.options.map(function (o, i) { return '<button type="button" class="opt" data-i="' + i + '">' + esc(o) + '</button>'; }).join('') + '</div>' : '') +
    '<div class="row"><button type="button" class="btn primary" id="confirm" disabled>' + esc(t('confirm')) + '</button><button type="button" class="btn" id="skip">' + esc(t('skip')) + '</button></div>';
  bindChoice(panel, it.pick ? '.cell' : '.opt', function (i) { sel = i; $('#confirm').disabled = false; });
  $('#confirm').addEventListener('click', function () { if (done || sel === null) return; done = true; answerAndNext(it.id, sel); });
  $('#skip').addEventListener('click', function () { if (done) return; done = true; answerAndNext(it.id, -1); });
}
function mountLikert(step, panel) {
  const it = step.item;
  let sel = null, done = false;
  panel.innerHTML = '<div class="muted">' + esc(t('likertQ')) + '</div><div class="prompt strong">' + esc(it.text) + '</div>' +
    '<div class="opts">' + t('likert').map(function (o, i) { return '<button type="button" class="opt" data-i="' + i + '">' + (i + 1) + ' · ' + esc(o) + '</button>'; }).join('') + '</div>' +
    '<div class="row"><button type="button" class="btn primary" id="confirm" disabled>' + esc(t('confirm')) + '</button><button type="button" class="btn" id="skip">' + esc(t('skip')) + '</button></div>';
  bindChoice(panel, '.opt', function (i) { sel = i; $('#confirm').disabled = false; });
  $('#confirm').addEventListener('click', function () { if (done || sel === null) return; done = true; answerAndNext(it.id, sel); });
  $('#skip').addEventListener('click', function () { if (done) return; done = true; answerAndNext(it.id, -1); });
}
function genDigits(n) {
  let s = '';
  while (s.length < n) {
    const d = String(ri(0, 9));
    if (s.length === 0 || s[s.length - 1] !== d) s += d;
  }
  return s;
}
function mountSpan(step, panel) {
  const dir = step.dir;
  const startLen = dir === 'fwd' ? 3 : 2, maxLen = dir === 'fwd' ? 9 : 8;
  let len = startLen, fails = 0, best = 0, trial = 1, digits = genDigits(len), phase = 'show', input = '', finished = false;
  function done(v) {
    if (finished) return;
    finished = true; clearTimers();
    S.scores[dir === 'fwd' ? 'wm_f' : 'wm_b'] = v;
    next();
  }
  function submit(skip) {
    const target = dir === 'fwd' ? digits : digits.split('').reverse().join('');
    const ok = !skip && input === target;
    input = ''; trial += 1;
    if (ok) {
      best = len;
      if (len >= maxLen) { done(len); return; }
      len += 1; fails = 0; digits = genDigits(len); phase = 'show'; draw();
    } else if (fails === 0) {
      fails = 1; digits = genDigits(len); phase = 'show'; draw();
    } else { done(best); }
  }
  function updateEntry() {
    $('#entry').textContent = input + '·'.repeat(len - input.length);
    $('#subm').disabled = input.length !== len;
  }
  function draw() {
    clearTimers();
    const instr = dir === 'fwd' ? t('spanFwd') : t('spanBack');
    if (phase === 'show') {
      panel.innerHTML = '<p class="muted">' + esc(instr) + '</p><div class="digits">' + digits + '</div><p class="muted small">' + esc(t('watch', { n: trial })) + '</p>';
      timers.to = setTimeout(function () { phase = 'recall'; draw(); }, 900 + len * 800);
    } else {
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', 'Clear'];
      panel.innerHTML = '<p class="muted">' + esc(instr) + '</p><div class="digits entry" id="entry"></div>' +
        '<div class="keypad">' + keys.map(function (k) { return '<button type="button" class="key" data-k="' + k + '">' + (k === 'Clear' ? esc(t('clear')) : k) + '</button>'; }).join('') + '</div>' +
        '<div class="row"><button type="button" class="btn primary" id="subm" disabled>' + esc(t('submit')) + '</button><button type="button" class="btn" id="skipd">' + esc(t('skipOne')) + '</button></div>' +
        '<p class="muted small">' + esc(t('enterN', { n: len, t: trial })) + '</p>';
      $$('.key', panel).forEach(function (el) {
        el.addEventListener('click', function () {
          const k = el.getAttribute('data-k');
          if (k === '⌫') input = input.slice(0, -1);
          else if (k === 'Clear') input = '';
          else if (input.length < len) input += k;
          updateEntry();
        });
      });
      $('#subm').addEventListener('click', function () { if (input.length === len) submit(false); });
      $('#skipd').addEventListener('click', function () { submit(true); });
      updateEntry();
    }
  }
  draw();
}
function mountSpeed(step, panel) {
  const items = step.items, total = step.secs;
  let i = 0, c = 0, a = 0, finished = false, endAt = 0;
  function fin() {
    if (finished) return;
    finished = true; clearTimers();
    S.scores.sp_c = c; S.scores.sp_a = a;
    next();
  }
  function remaining() { return Math.max(0, Math.ceil((endAt - Date.now()) / 1000)); }
  function tick() {
    const r = remaining();
    const el = $('#tleft'); if (el) el.textContent = r + 's';
    const b = $('#tbar'); if (b) b.style.width = (r / total * 100) + '%';
    if (r <= 0) fin();
  }
  function advance() { i += 1; if (i >= items.length) fin(); else drawItem(); }
  function drawItem() {
    const it = items[i];
    panel.innerHTML = '<div class="tline"><span class="muted small">' + esc(t('timeLeft')) + '</span><strong id="tleft">' + remaining() + 's</strong></div>' +
      '<div class="bar thin"><span id="tbar" style="width:' + (remaining() / total * 100) + '%"></span></div>' +
      '<div class="muted small">' + esc(t('itemOf', { i: i + 1, n: items.length })) + '</div>' +
      '<div class="prompt strong">' + esc(it.prompt) + '</div>' +
      '<div class="opts two">' + it.options.map(function (o, k) { return '<button type="button" class="opt" data-i="' + k + '">' + esc(o) + '</button>'; }).join('') + '</div>' +
      '<div class="row"><button type="button" class="btn" id="skipq">' + esc(t('skip')) + '</button></div>';
    $$('.opt', panel).forEach(function (el) {
      el.addEventListener('click', function () {
        if (finished) return;
        a += 1;
        if (parseInt(el.getAttribute('data-i'), 10) === it.answer) c += 1;
        advance();
      });
    });
    $('#skipq').addEventListener('click', function () { if (!finished) advance(); });
  }
  panel.innerHTML = '<p>' + esc(t('speedIntro', { n: items.length, s: total })) + '</p>' +
    '<button type="button" class="btn primary" id="go">' + esc(t('startClock')) + '</button>';
  $('#go').addEventListener('click', function () {
    endAt = Date.now() + total * 1000;
    drawItem();
    timers.iv = setInterval(tick, 200);
  });
}
function next() {
  if (S.level === 0 && S.idx + 1 === STARTER_N) {
    S.level = routeLevel(S.steps, S.answers);
    S.steps = S.steps.concat(buildRest(S.level));
    S.idx += 1;
    renderRun();
    return;
  }
  if (S.idx + 1 >= S.steps.length) { finishRun(); return; }
  S.idx += 1;
  renderRun();
}

/* ---- finish, review, submit ---- */
function finishRun() {
  clearTimers();
  const ageN = parseInt(S.bio.age, 10);
  const band = bandForAge(ageN);
  const adj = bioAdjust(S.bio, ageN);
  const result = computeResult(S.steps, S.answers, S.scores, band, adj.adj, S.level);
  const report = buildReport(result, S.bio, band.label);
  const d = new Date();
  const p2 = function (n) { return n < 10 ? '0' + n : String(n); };
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
  const starterC = S.steps.slice(0, STARTER_N).reduce(function (acc, s) { return acc + (s.kind === 'mc' ? scoreItem(s.item, S.answers[s.item.id]) : 0); }, 0);
  S.payload = buildPayload({
    result: result, report: report, bio: S.bio, band: band, adj: adj, starterC: starterC,
    reportId: 'MIQ-' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '-' + code,
    timestamp: d.toISOString(),
    testDate: d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
  });
  S.text = buildReportText(S.payload);
  S.phase = 'review';
  render();
}
function renderReview() {
  root.innerHTML = headerHtml() +
    '<section class="card"><h2>' + esc(t('doneTitle')) + '</h2>' +
    '<p>' + t('doneText') + '</p>' +
    (S.error ? '<div class="error">' + esc(S.error) + '</div>' : '') +
    '<button type="button" class="btn primary" id="submitBtn"' + (S.submitting ? ' disabled' : '') + '>' + esc(S.submitting ? t('submitting') : (S.error ? t('retry') : t('submitTest'))) + '</button>' +
    '<p class="muted small">' + esc(t('keepOpen')) + '</p></section>';
  $('#submitBtn').addEventListener('click', submitTest);
}
function submitTest() {
  if (S.submitting || S.submitted || !S.payload) return;
  S.submitting = true; S.error = '';
  renderReview();
  const notConfigured = !SHEET_URL || SHEET_URL.indexOf('PASTE_YOUR') === 0;
  if (notConfigured) {
    S.submitting = false;
    S.error = t('errNoSheet');
    renderReview();
    return;
  }
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const tmr = ctrl ? setTimeout(function () { ctrl.abort(); }, 25000) : null;
  fetch(SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ data: S.payload, reportText: S.text }),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function () {
    if (tmr) clearTimeout(tmr);
    S.submitting = false; S.submitted = true; S.phase = 'done';
    render();
  }).catch(function () {
    if (tmr) clearTimeout(tmr);
    S.submitting = false;
    S.error = t('errSend');
    renderReview();
  });
}
function renderDone() {
  root.innerHTML = headerHtml() +
    '<section class="card center"><h2>' + esc(t('thanksTitle')) + '</h2><p class="big">' + esc(t('thanksText')) + '</p></section>' +
    (DEBUG_PREVIEW ? '<section class="card"><h2>Debug preview</h2><pre>' + esc(S.text) + '</pre></section>' : '');
}

if (typeof document !== 'undefined') {
  document.title = APP_NAME;
  EST = estimate();
  render();
}

</script>
